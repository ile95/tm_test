<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Teachable Machine AI</title>

<!-- TensorFlow.js -->
<script defer
src="https://unpkg.com/@tensorflow/tfjs@4.10.0/dist/tf.min.js">
</script>

<!-- Teachable Machine -->
<script defer
src="https://unpkg.com/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js">
</script>

<style>

body{
    margin:0;
    padding:0;
    background:black;
    color:white;
    text-align:center;
    font-family:sans-serif;
}

h1{
    margin-top:20px;
}

video{
    width:95%;
    max-width:500px;
    border-radius:20px;
    margin-top:20px;
}

#label{
    font-size:40px;
    font-weight:bold;
    margin-top:20px;
}

#prob{
    font-size:25px;
    margin-top:10px;
}

button{
    font-size:25px;
    padding:15px 25px;
    margin-top:25px;
    border:none;
    border-radius:15px;
}

</style>

</head>

<body>

<h1>Teachable Machine AI</h1>

<video
    id="video"
    autoplay
    playsinline
    muted>
</video>

<div id="label">
WAIT...
</div>

<div id="prob">
</div>

<button onclick="startAI()">
START AI
</button>

<script>

// =========================
// Teachable Machine 모델 주소
// 반드시 마지막 "/" 포함
// =========================

const URL =
"https://teachablemachine.withgoogle.com/models/ccZjL8FrR/";

// =========================

let model;

let video;

// =========================
// AI 시작
// =========================

async function startAI(){

    try{

        AppInventor.setWebViewString(
            "LOADING MODEL..."
        );

        // 모델 로드
        model = await tmImage.load(
            URL + "model.json",
            URL + "metadata.json"
        );

        AppInventor.setWebViewString(
            "MODEL LOADED"
        );

        // 카메라 접근
        const stream =
            await navigator.mediaDevices.getUserMedia({
                video:{
                    facingMode:"environment"
                },
                audio:false
            });

        // video 연결
        video =
            document.getElementById("video");

        video.srcObject = stream;

        // 영상 준비 대기
        await video.play();

        AppInventor.setWebViewString(
            "CAMERA START"
        );

        // 예측 시작
        predictLoop();

    }

    catch(err){

        document.getElementById("label").innerHTML =
            "ERROR";

        document.getElementById("prob").innerHTML =
            err;

        AppInventor.setWebViewString(
            "ERROR : " + err
        );
    }
}

// =========================
// 실시간 예측 루프
// =========================

async function predictLoop(){

    // 예측
    const prediction =
        await model.predict(video);

    let bestClass = "";

    let bestProb = 0;

    // 최고 확률 찾기
    for(let i=0; i<prediction.length; i++){

        if(prediction[i].probability > bestProb){

            bestProb =
                prediction[i].probability;

            bestClass =
                prediction[i].className;
        }
    }

    // HTML 출력
    document.getElementById("label").innerHTML =
        bestClass;

    document.getElementById("prob").innerHTML =
        (bestProb * 100).toFixed(1)
        + "%";

    // 앱인벤터 전달
    AppInventor.setWebViewString(
        bestClass + "," +
        (bestProb * 100).toFixed(1)
    );

    // 반복
    requestAnimationFrame(
        predictLoop
    );
}

</script>

</body>

</html>
